name: OpsFusion regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shipped JavaScript syntax
        run: |
          node --check app.js
          node --check cloud.js
          node --check automation.js
      - name: Run IPv4, automation and production-hardening regressions
        run: node --test tests/*.test.mjs
